<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRACTICAL 9</title>
    <style>
    .container{
    display: grid;
    grid-template-columns: repeat(4,1fr);
    grid-template-rows: 1fr;
    margin: 20px;
    gap: 50px ;
}
.itme{
    border: 1px solid grey;
    border-radius: 20px;
    height: 200px;
    width: 300px;
    background-color: rgba(255, 255, 255, 0.63);
    box-shadow: 1px 1px 4px 1px rgb(108, 108, 108);
    text-align: center;
    align-content: center;

}
body{
    background-color:rgb(218, 218, 218);
}
.details{
    font-size: 15px;
    color: rgba(77, 78, 78, 0.774);
}
@media(max-width: 1024px) {
    .container{
        grid-template-columns: 2fr 2fr;
        grid-template-rows: 2fr 2fr;
    }
}
@media (max-width: 600px) {
    .container{
    grid-template-columns: 1fr;
    grid-template-rows: max-content;

}
}
</style>
</head>
<body>
    <h3 style="text-align: center;">Responsive Porduct Grid</h3>
    <div class="container">
        
        <div class="itme">
            <img src="box2_image.jpg" alt="product 1" width="300px" height="200px" >
            <p><b>Porduct 1</b></p>
            <div class="details">High-quality item with great features.</div>
            <div class="price">&#8377;499</div>
        </div>
        <div class="itme">
            <img src="box5_image.jpg" alt="product 1" width="300px" height="200px">
            <p><b>Porduct 1</b></p>
            <div class="details">Durable and stylish for daily use.</div>
            <div class="price">&#8377;799</div>
        </div>
        <div class="itme">
            <img src="box4_image.jpg" alt="product 1" width="300px" height="200px">
            <p><b>Porduct 1</b></p>
            <div class="details">Lightweight and comfortable.</div>
            <div class="price"></div>&#8377;1,299</div>
        <div class="itme">
            <img src="box5_image.jpg" alt="product 1" width="300px" height="200px">
            <p><b>Porduct 1</b></p>
            <div class="details">Trendy design witn premium quality.</div>
            <div class="price">&#8377;999</div>
        </div>
        
    </div>
    
</body>
</html>
